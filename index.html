<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FidgetFit">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="FidgetFit">
<meta name="description" content="职场久坐族的微运动 App：久坐提醒、2 分钟跟练、100 个微动作动作库。">
<script>try{if(window.self!==window.top)document.documentElement.classList.add("embedded")}catch(e){document.documentElement.classList.add("embedded")}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>FidgetFit 轻弹玩家</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Noto+Sans+SC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --top:48px;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
  --bg:#000;--s1:#121212;--s2:#161616;--s3:#1A1A1A;--line:#222;--line2:#2A2A2A;
  --mint:#4CB5AE;--orange:#FF8A5C;--muted:#9A9A9A;--dim:#7A7A7A;--soft:#CFCFCF;--white:#fff;
  --display:'Anton',Impact,sans-serif;--body:'Noto Sans SC',-apple-system,'PingFang SC',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#0A0A0A;color:var(--white);font-family:var(--body)}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.d{font-family:var(--display);font-weight:400}

/* ---------- stage ---------- */
.stage{min-height:100%;display:flex;align-items:center;justify-content:center;gap:72px;padding:24px}
.intro{max-width:340px;display:flex;flex-direction:column;gap:18px}
.intro .k{font-size:12px;letter-spacing:2px;color:var(--muted)}
.intro h1{font-family:var(--display);font-weight:400;font-size:72px;line-height:.9;text-transform:uppercase}
.intro h1 span{color:var(--mint)}
.intro p{font-size:15px;line-height:1.7;color:var(--soft)}
.intro .sw{display:flex;gap:10px}
.intro .sw i{width:40px;height:40px;border-radius:12px;display:block}
.intro ul{list-style:none;display:flex;flex-direction:column;gap:8px;font-size:13px;color:var(--muted)}
.intro li::before{content:'';display:inline-block;width:6px;height:6px;border-radius:3px;background:var(--orange);margin-right:10px;vertical-align:middle}

.phone{position:relative;width:390px;height:min(844px,calc(100vh - 48px));min-height:640px;background:var(--bg);border-radius:54px;border:10px solid #1C1C1C;box-shadow:0 0 0 1px #2C2C2C,0 40px 120px rgba(0,0,0,.6);overflow:hidden;flex-shrink:0}
@media (max-width:820px){.intro{display:none}}
/* installed app: always full-bleed, no device frame */
@media (display-mode: standalone), (display-mode: minimal-ui){
  html,body{background:#000;overscroll-behavior:none}
  .stage{padding:0;min-height:100dvh}
  .intro{display:none}
  .phone{position:fixed;inset:0;width:auto;height:auto;min-height:0;border-radius:0;border:none;box-shadow:none}
  .tabbar{height:calc(78px + var(--sab))}
  .view{bottom:calc(78px + var(--sab))}
}
body{-webkit-user-select:none;user-select:none}
input{-webkit-user-select:text;user-select:text}
.installbtn{height:36px;padding:0 14px;border-radius:999px;background:var(--orange);color:#000;font-size:13px;font-weight:900;flex-shrink:0}
.installbtn.done{background:transparent;border:1px solid #2E5653;color:var(--mint)}
@media (max-width:500px){
  .stage{padding:0}
  .phone{position:fixed;inset:0;width:auto;height:auto;min-height:0;border-radius:0;border:none;box-shadow:none}
}
/* inside a preview frame there is no notch to clear */
html.embedded{--sat:0px;--sab:0px;--top:20px}

/* ---------- shell ---------- */
.view{position:absolute;top:0;left:0;right:0;bottom:88px;overflow-y:auto;overflow-x:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.view::-webkit-scrollbar,.hscroll::-webkit-scrollbar,.scrollx::-webkit-scrollbar,.lib::-webkit-scrollbar{display:none}
.view.enter{animation:fadeIn .35s ease both}
.page{padding:calc(var(--top) + var(--sat)) 20px 32px;display:flex;flex-direction:column;gap:24px}
.page.home{padding-left:0;padding-right:0}
.page.home > .px{margin:0 20px}
.press{transition:transform .15s ease,background .2s ease,color .2s ease}
.press:active{transform:scale(.96)}

.tabbar{position:absolute;left:0;right:0;bottom:0;height:88px;padding:10px 8px var(--sab);background:rgba(0,0,0,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid #1F1F1F;display:grid;grid-template-columns:repeat(5,1fr);z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--dim);min-height:48px;transition:color .2s ease}
.tab .dot{width:4px;height:4px;border-radius:2px;background:var(--mint);opacity:0;transition:opacity .2s ease}
.tab.on{color:var(--white);font-weight:700}
.tab.on .dot{opacity:1}
.fab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700}
.fab span{position:relative;width:60px;height:60px;margin-top:-28px;border-radius:30px;background:var(--orange);color:#000;border:4px solid #000;display:flex;align-items:center;justify-content:center}
.fab span::before{content:'';position:absolute;inset:-4px;border-radius:34px;border:2px solid var(--orange);animation:ping 1.8s ease-out infinite}

/* ---------- shared ---------- */
.langpill{display:flex;align-items:center;height:30px;padding:3px;border-radius:999px;border:1px solid var(--line2);font-size:11px;font-weight:900;letter-spacing:.5px;flex-shrink:0}
.langpill span{height:22px;min-width:26px;padding:0 7px;border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:background .2s,color .2s}
.langpill span.on{background:#fff;color:#000}
.round{width:44px;height:44px;border-radius:22px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0}
.kicker{font-size:12px;color:var(--muted);letter-spacing:1px}
.h2row{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.h2{font-size:20px;font-weight:900}
.link{font-size:13px;color:var(--muted);padding:8px 0}
.pill{height:40px;padding:0 18px;border-radius:999px;font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.pill.white{background:#fff;color:#000}
.pill.big{height:52px;padding:0 26px;font-size:16px;font-weight:900}
.bigtitle{font-family:var(--display);font-weight:400;font-size:72px;line-height:.92;text-transform:uppercase}
.card{background:var(--s1);border:1px solid var(--line);border-radius:28px;padding:22px}
.live{display:flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:999px;border:1px solid var(--line2);font-size:10px;font-weight:700;letter-spacing:1px;color:var(--mint)}
.blink{width:6px;height:6px;border-radius:3px;background:var(--mint);animation:blink 1.2s ease-in-out infinite;display:inline-block}
.badge-dot{position:absolute;top:10px;right:11px;width:7px;height:7px;border-radius:4px;background:var(--orange)}
.price{font-family:var(--display);font-size:22px}
.was{font-size:13px;color:var(--dim);text-decoration:line-through;margin-left:8px;font-family:var(--body)}

/* ---------- home ---------- */
.topbar{display:flex;justify-content:space-between;align-items:center;height:44px}
.brand{display:flex;align-items:center;gap:10px}
.brand b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.5px}
.hero{display:flex;flex-direction:column;gap:10px}
.hero{position:relative}
.hero h1{font-family:var(--display);font-weight:400;font-size:76px;line-height:.88;letter-spacing:-.5px;text-transform:uppercase}
.hero h1 .ln{display:block;width:max-content;max-width:100%;text-align:left;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;line-height:inherit;animation:letter .7s cubic-bezier(.2,.8,.2,1) both;position:relative}
.hero h1 .ln:nth-child(2){animation-delay:.1s;margin-left:16%}
.hero h1 .ln:nth-child(3){animation-delay:.2s;color:var(--mint);margin-left:auto}
.hero h1{display:flex;flex-direction:column;align-items:flex-start}
.hero p{text-align:right}
.ch{display:inline-block;white-space:pre}
.ln.jump .ch{animation:chJump .55s cubic-bezier(.3,1.6,.5,1) both;animation-delay:calc(var(--i) * 45ms)}
.ln.jitter .ch{animation:chJitA .1s linear 10 alternate both}
.ln.jitter .ch:nth-child(even){animation-name:chJitB}
.ln.breaking .ch{animation:chBreak 1.2s cubic-bezier(.3,.7,.3,1) both;animation-delay:calc(var(--i) * 35ms)}
.mhint{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);letter-spacing:1px}
.mhint .tap{animation:bob 1.4s ease-in-out infinite;display:inline-block;color:var(--orange)}
.stk{position:absolute;left:var(--x);top:var(--y);height:24px;padding:0 9px;border-radius:999px;font-size:11px;font-weight:900;display:flex;align-items:center;white-space:nowrap;pointer-events:none;z-index:4;animation:stkFly 1.2s cubic-bezier(.2,.8,.3,1) both}
#mPop{position:absolute;inset:0;pointer-events:none;z-index:6}
.mtip{position:absolute;pointer-events:auto;width:min(244px,calc(100% - 8px));background:rgba(20,20,20,.97);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid #2E2E2E;border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;box-shadow:0 12px 32px rgba(0,0,0,.55);animation:tipIn .28s cubic-bezier(.2,.9,.3,1.2) both;color:#fff;font-family:var(--body)}
.mtip .k{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:900;letter-spacing:1.5px;color:var(--muted);padding-right:24px}
.mtip .k i{width:6px;height:6px;border-radius:3px;background:var(--orange)}
.mtip.fidget .k i{background:var(--mint)}
.mtip.brk .k i{background:#fff}
.mtip .t{font-size:13px;font-weight:700;line-height:1.5}
.mtip .t.swap{animation:fadeUp .3s ease both}
.mtip .r{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:28px}
.mtip .r span{font-size:11px;color:var(--muted)}
.mtip .bt{display:flex;gap:6px;flex-shrink:0}
.mtip .b{height:28px;padding:0 12px;border-radius:999px;background:#fff;color:#000;font-size:12px;font-weight:900}
.mtip.take .b{background:var(--orange)}
.mtip.fidget .b{background:var(--mint)}
.mtip .g{height:28px;padding:0 10px;border-radius:999px;border:1px solid #3A3A3A;font-size:12px;font-weight:700;color:var(--soft)}
.mtip .x{position:absolute;top:5px;right:5px;width:26px;height:26px;border-radius:13px;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.mtip .x svg{width:13px;height:13px}
.mring{position:relative;width:30px;height:30px;flex-shrink:0;display:inline-block}
.mring svg{position:absolute;inset:0}
.mring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:400;font-size:12px;color:#fff}
.mtip .live2{display:flex;align-items:center;gap:8px}
@keyframes tipIn{from{opacity:0;transform:translateY(-6px) scale(.92)}to{opacity:1;transform:none}}
@keyframes chJump{0%{transform:none}35%{transform:translateY(-12px)}65%{transform:translateY(2px)}100%{transform:none}}
@keyframes chJitA{0%{transform:rotate(-4deg)}100%{transform:rotate(4deg)}}
@keyframes chJitB{0%{transform:rotate(4deg)}100%{transform:rotate(-4deg)}}
@keyframes chBreak{0%{transform:none}30%,55%{transform:translateY(22px) rotate(var(--r));opacity:.5}100%{transform:none;opacity:1}}
@keyframes stkFly{0%{transform:translate(0,0) scale(.4);opacity:0}20%{opacity:1;transform:translate(calc(var(--dx) * .4),calc(var(--dy) * .4)) scale(1.05)}100%{transform:translate(var(--dx),var(--dy)) scale(.9);opacity:0}}
.hero p{margin-top:10px;font-size:15px;color:var(--soft);animation:fadeUp .6s ease .35s both}
.marquee{background:var(--orange);color:#000;height:40px;overflow:hidden;display:flex;align-items:center;transform:rotate(-2deg);margin:0 -10px}
.marquee div{display:flex;width:max-content;animation:marquee 14s linear infinite;font-family:var(--display);font-size:20px;letter-spacing:1px;white-space:nowrap}
.marquee span{padding-right:28px}
.next{position:relative;overflow:hidden;display:flex;flex-direction:column;gap:12px;animation:fadeUp .6s ease .25s both}
.next .figwrap{display:block}
.figbtn{position:absolute;right:4px;top:100px;padding:0;z-index:2}
.next .nm-main{padding-right:96px;display:flex;flex-direction:column;gap:12px}
.figbtn .figwrap.boing{animation:boing .6s cubic-bezier(.3,1.6,.5,1)}
.bubble{position:absolute;right:0;bottom:calc(100% + 6px);width:max-content;max-width:92px;text-align:center;line-height:1.2;background:#fff;color:#000;font-size:11.5px;font-weight:900;padding:7px 11px;border-radius:14px;pointer-events:none;animation:popIn .3s ease both;z-index:3}
.bubble::after{content:'';position:absolute;right:42px;bottom:-5px;width:10px;height:10px;background:#fff;transform:rotate(45deg);border-radius:2px}
.bubble.hint{animation:popIn .3s ease both,bob 1.2s ease-in-out .3s infinite}
.bubble.gone{opacity:0;transform:scale(.6);transition:opacity .2s ease,transform .2s ease}
.next.flip{animation:flip .45s ease both}
.tagrow2{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1px;position:relative;z-index:3}
.tagrow2 em{font-style:normal;background:var(--orange);color:#000;padding:4px 10px;border-radius:999px}
.tagrow2 span{color:var(--soft)}
.shuf{height:28px;padding:0 10px;border-radius:999px;border:1px solid #333;font-size:11px;font-weight:700;color:var(--soft);display:inline-flex;align-items:center;gap:4px}
.shuf svg{transition:transform .4s ease}
.shuf.spin svg{transform:rotate(360deg)}
.clockbtn{display:flex;flex-direction:column;gap:4px;text-align:left;color:inherit}
.clockbtn .lbl i{font-style:normal;opacity:.6;font-weight:500}
.insight{display:none;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.insight.on{display:grid;animation:fadeUp .3s ease both}
.insight div{background:rgba(255,255,255,.06);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.insight b{font-family:var(--display);font-weight:400;font-size:22px;line-height:1.1}
.insight span{font-size:11px;opacity:.7}
.sit.over .insight div{background:rgba(0,0,0,.12)}
.sit.shake{animation:shake .5s ease}
.sit .btn{position:relative}
.mini{position:absolute;left:50%;top:50%;width:0;height:0;pointer-events:none}
.mini span{position:absolute;left:0;top:0;width:0;height:0}
.mini i{position:absolute;left:-4px;top:-4px;width:8px;height:8px;border-radius:50%;animation:miniBurst .7s cubic-bezier(.15,.7,.3,1) both}
.tipcard{border:1px solid #2E5653;background:rgba(76,181,174,.07);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;animation:fadeUp .5s ease .35s both}
.tipcard .hd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tipcard .hd span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--mint);letter-spacing:1px}
.tipcard .x{width:32px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.tipcard p{font-size:14px;font-weight:700;line-height:1.5}
.tipcard p.swap{animation:fadeUp .35s ease both}
.tipcard .ft{display:flex;justify-content:space-between;align-items:center}
.tipcard .dots{display:flex;gap:5px}
.tipcard .dots i{width:6px;height:6px;border-radius:3px;background:#2E5653;transition:width .25s ease,background .25s ease}
.tipcard .dots i.on{width:16px;background:var(--mint)}
.tipcard .nx{height:30px;padding:0 12px;border-radius:999px;background:var(--mint);color:#000;font-size:12px;font-weight:900;display:inline-flex;align-items:center;gap:4px}
.marquee{cursor:pointer}
.marquee.fast div{animation-duration:4s}
.greet{display:flex;flex-direction:column;gap:2px}
.greet small{font-size:12px;color:var(--muted);letter-spacing:1px}
.greet b{font-size:17px;font-weight:900}
@keyframes boing{0%{transform:none}30%{transform:translateY(-22px) rotate(-8deg) scale(1.05,.95)}60%{transform:translateY(0) scale(1.08,.9)}80%{transform:scale(.97,1.04)}100%{transform:none}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes flip{0%{transform:perspective(900px) rotateX(0)}50%{transform:perspective(900px) rotateX(70deg);opacity:.4}100%{transform:perspective(900px) rotateX(0)}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
@keyframes miniBurst{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-46px) scale(.3);opacity:0}}
@keyframes wig{0%,100%{transform:none}25%{transform:skewX(-12deg) translateX(6px)}50%{transform:skewX(8deg) translateX(-4px)}75%{transform:skewX(-4deg)}}
.tag{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;letter-spacing:1px}
.tag em{font-style:normal;background:var(--orange);color:#000;padding:4px 10px;border-radius:999px}
.tag span{color:var(--soft)}
.sit{border-radius:28px;padding:20px;display:flex;flex-direction:column;gap:14px;background:var(--s1);color:#fff;transition:background .4s ease,color .4s ease}
.sit .lbl{font-size:12px;letter-spacing:1px;font-weight:700;opacity:.75}
.sit .clock{font-family:var(--display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums}
.sit .tgt{font-size:12px;font-weight:700;opacity:.8}
.sit .track{height:10px;border-radius:5px;background:#262626;overflow:hidden}
.sit .bar{height:10px;border-radius:5px;background-color:var(--mint);background-image:repeating-linear-gradient(45deg,rgba(0,0,0,.22) 0 7px,transparent 7px 14px);background-size:28px 10px;animation:stripes 1s linear infinite;transition:width .9s linear}
.sit .btn{height:40px;padding:0 16px;border-radius:999px;background:#fff;color:#000;font-size:13px;font-weight:700;white-space:nowrap}
.sit.over{background:var(--orange);color:#000}
.sit.over .track{background:rgba(0,0,0,.2)}
.sit.over .bar{background-color:#000}
.sit.over .btn{background:#000;color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stats div{border-top:2px solid #fff;padding-top:10px;display:flex;flex-direction:column;gap:4px}
.stats div.o{border-color:var(--orange)}
.stats b{font-family:var(--display);font-weight:400;font-size:40px;line-height:1}
.stats div.o b{color:var(--orange)}
.stats span{font-size:12px;color:var(--muted)}
.rhythm{background:#0E0E0E;border:1px solid #1F1F1F;border-radius:24px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:14px}
.bars{height:92px;display:grid;grid-template-columns:repeat(9,1fr);gap:8px;align-items:end}
.bars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;height:92px}
.bars i{display:block;width:100%;border-radius:6px;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;transition:height .5s ease}
.bars span{font-size:10px;color:var(--dim)}
.bars span.now{color:#fff}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.scene{flex:0 0 auto;width:150px;height:180px;border-radius:24px;background:#141414;border:1px solid var(--line2);padding:16px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.scene.first{background:var(--mint);color:#000;border:none}
.scene .n{font-family:var(--display);font-size:54px;line-height:.9;opacity:.9}
.scene .e{font-family:var(--display);font-size:24px;line-height:1;display:block}
.scene .z{font-size:13px;font-weight:700}
.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #1A1A1A}
.avatar{width:44px;height:44px;border-radius:22px;color:#000;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;flex-shrink:0}
.person .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.person .t b{font-size:14px}
.person .t span{font-size:12px;color:var(--muted)}
.hi{height:40px;padding:0 14px;border-radius:999px;border:1px solid #333;font-size:13px;font-weight:700}

.sheet{position:absolute;left:0;right:0;bottom:0;background:#141414;border-radius:28px 28px 0 0;padding:12px 20px calc(32px + var(--sab));display:flex;flex-direction:column;gap:16px;animation:slideUp .35s cubic-bezier(.2,.8,.2,1) both}
.sheet .grab{align-self:center;width:40px;height:5px;border-radius:3px;background:#3A3A3A}

.sheet .img b{font-family:var(--display);font-weight:400;font-size:52px;line-height:.9;text-transform:uppercase}
.sheet h3{font-size:22px;font-weight:900}
.sheet .sub{font-size:13px;color:var(--muted);line-height:1.6}
.mvchips{display:flex;gap:8px;flex-wrap:wrap}
.mvchips span,.idea{height:32px;padding:0 12px;border-radius:999px;border:1px solid #333;display:flex;align-items:center;font-size:13px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two button{height:54px;border-radius:999px;font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;gap:8px}
.field input{width:100%;height:54px;border-radius:16px;background:#0C0C0C;border:1px solid #333;padding:0 16px;font-size:16px;outline:none}
.field input:focus{border-color:var(--mint)}

.session{background:#000;padding:calc(24px + var(--sat)) 20px calc(20px + var(--sab));display:flex;flex-direction:column;gap:clamp(10px,2.2vh,20px);overflow-y:auto;scrollbar-width:none;animation:slideUp .45s cubic-bezier(.2,.8,.2,1) both}
.session header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.session header .ttl{font-size:13px;font-weight:700;letter-spacing:1px;text-align:center;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mode{height:32px;padding:0 12px;border-radius:999px;background:var(--s2);border:1px solid #262626;display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mint);font-weight:700;flex-shrink:0}
.segs{display:grid;gap:6px}
.segs div{height:4px;border-radius:2px;background:#262626;overflow:hidden}
.segs i{display:block;height:4px;transition:width 1s linear}
.stagebox{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,1.8vh,18px);min-height:0}
.dial{position:relative;width:min(290px,70vw,38vh);aspect-ratio:1;flex-shrink:0}
.dial .glow{position:absolute;inset:4%;border-radius:50%;background:var(--mint);animation:breathe 4s ease-in-out infinite}
.dial svg.r{position:absolute;inset:0;width:100%;height:100%}
.dial .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.dial .t{font-family:var(--display);font-size:clamp(40px,7.5vh,66px);line-height:1;font-variant-numeric:tabular-nums}
.addt{height:30px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);font-size:12px;font-weight:900;color:var(--mint);margin-top:4px}
.addt[disabled]{color:var(--muted);border-style:dashed}
.dial .t.bump{animation:tBump .4s cubic-bezier(.3,1.6,.5,1)}
@keyframes tBump{0%{transform:scale(1)}40%{transform:scale(1.12);color:var(--mint)}100%{transform:scale(1)}}
.dial .s.ok{color:var(--mint);font-weight:900}
.dial.buzz{animation:dialBuzz .5s ease}
.dial.buzz::after{content:'';position:absolute;inset:-2%;border-radius:50%;border:3px solid var(--mint);animation:dialRipple .9s ease-out both;pointer-events:none}
@keyframes dialBuzz{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-1deg)}40%{transform:translateX(5px) rotate(1deg)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
@keyframes dialRipple{0%{opacity:.9;transform:scale(.96)}100%{opacity:0;transform:scale(1.12)}}
.dial .s{font-size:12px;color:var(--soft);letter-spacing:2px;max-width:64%;text-align:center;line-height:1.3}
html.lang-en .dial .s{letter-spacing:.5px}
#sesFig{animation:popIn .4s ease both}
#sesFig svg{width:clamp(56px,11vh,100px);height:auto}
.mv{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;flex-shrink:0}
.mv h2{font-size:clamp(20px,3vh,26px);font-weight:900}
.mv p{font-size:14px;color:var(--soft);max-width:310px;line-height:1.5}
.mv.swap{animation:fadeUp .4s ease both}
.ctrls{display:flex;align-items:center;justify-content:center;gap:28px;flex-shrink:0}
.ctrls .sm{width:56px;height:56px;border-radius:28px;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center}
.ctrls .lg{width:clamp(64px,10vh,84px);height:clamp(64px,10vh,84px);border-radius:50%;background:#fff;color:#000;display:flex;align-items:center;justify-content:center}
.upnext{flex-shrink:0;background:var(--s1);border:1px solid var(--line);border-radius:20px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.upnext small{font-size:12px;color:var(--muted)}
.upnext b{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.upnext span{font-family:var(--display);font-size:16px;color:var(--mint)}
.session.paused *{animation-play-state:paused !important}

.ov.done{background:var(--orange);color:#000;padding:calc(var(--top) + var(--sat)) 20px calc(32px + var(--sab));display:flex;flex-direction:column;gap:20px;overflow:hidden;animation:fadeIn .3s ease both}
.burst{position:absolute;left:50%;top:38%;width:0;height:0;pointer-events:none}
.burst .rg{position:absolute;left:-90px;top:-90px;width:180px;height:180px;border-radius:90px;border:3px solid #000;animation:ringOut 1.2s ease-out both}
.burst .rg.w{border-color:#fff;animation-delay:.25s}
.burst .p{position:absolute;left:0;top:0;width:0;height:0}
.burst .p i{position:absolute;left:-6px;top:-6px;display:block;animation:burst 1.2s cubic-bezier(.15,.7,.3,1) both}
.ov.ov.done{overflow-y:auto}
.ov.done .big{font-family:var(--display);font-size:clamp(60px,11vh,96px);line-height:.86;text-transform:uppercase;animation:letter .7s cubic-bezier(.2,.8,.2,1) .2s both}
.ov.done .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;position:relative}
.ov.done .stats div{border-color:#000}
.ov.done .stats b{font-size:34px}
.ov.done .stats span{color:#000;font-weight:700}
.unlock{margin-top:10px;background:#000;color:#fff;border-radius:22px;padding:16px;display:flex;align-items:center;gap:14px;animation:popIn .5s ease .9s both}
.unlock i{width:52px;height:52px;border-radius:26px;background:var(--orange);display:flex;align-items:center;justify-content:center;flex-shrink:0}

.toast{position:absolute;left:50%;top:calc(var(--top) + var(--sat));z-index:40;transform:translateX(-50%);max-width:340px;background:#fff;color:#000;border-radius:999px;padding:12px 18px;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;white-space:nowrap;animation:toastIn .3s ease both;pointer-events:none}
.toast::before{content:'';width:8px;height:8px;border-radius:4px;background:var(--mint);flex-shrink:0}

/* ---------- motion figure: the original seated stick figure, a motion per move ---------- */
.of .h{transform-origin:78px 56px}
.of .ar{transform-origin:77px 70px}
.of .kk{transform-origin:72px 104px}
.of .ub{transform-origin:72px 104px}
.of .all{transform-origin:72px 150px}
.of-orig .h{animation:tilt 2.6s ease-in-out infinite}
.of-orig .ar{animation:swing 2.6s ease-in-out infinite}
.of-orig .kk{animation:kick .45s ease-in-out infinite}
.of-tilt .h{animation:tilt 2.4s ease-in-out infinite}
.of-nod .h{animation:oNod 2.4s ease-in-out infinite}
.of-turn .h{animation:oTurn 2.8s ease-in-out infinite}
.of-shrug .ar{animation:oShrug 1.6s ease-in-out infinite}
.of-roll .ar{animation:oRoll 2s linear infinite}
.of-squeeze .ar{animation:oSqz 2s ease-in-out infinite}
.of-reach .ar{animation:oReach 2.4s ease-in-out infinite}
.of-wrist .ar{animation:oWiggle .5s ease-in-out infinite}
.of-grip .ar{animation:oWiggle .7s ease-in-out infinite}
.of-bounce .kk{animation:kick .32s ease-in-out infinite}
.of-ext .kk{animation:oExt 2s ease-in-out infinite}
.of-ankle .kk{animation:oAnk .9s ease-in-out infinite}
.of-calf .all{animation:oCalf 1.4s ease-in-out infinite}
.of-squat .all{animation:oSquat 2.2s ease-in-out infinite}
.of-march .kk{animation:kick .9s ease-in-out infinite}
.of-march .ar{animation:swing .9s ease-in-out infinite}
.of-side .ub{animation:oSide 2.6s ease-in-out infinite}
.of-twist .ub{animation:oTwist 2.4s ease-in-out infinite}
.of-pelvic .ub{animation:oPelvic 2s ease-in-out infinite}
.of-breathe .ub{animation:oBreathe 4s ease-in-out infinite}
.of-eye .h{animation:oEye 2.4s ease-in-out infinite}
@keyframes tilt{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}
@keyframes swing{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(16deg)}}
@keyframes kick{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes oNod{0%,100%{transform:translate(0,0)}50%{transform:translate(2px,7px)}}
@keyframes oTurn{0%,50%,100%{transform:scaleX(1)}25%,75%{transform:scaleX(.6)}}
@keyframes oShrug{0%,100%{transform:translateY(0)}45%,60%{transform:translateY(-9px)}}
@keyframes oRoll{0%,100%{transform:translate(0,0)}25%{transform:translate(4px,-4px)}50%{transform:translate(0,-8px)}75%{transform:translate(-4px,-4px)}}
@keyframes oSqz{0%,100%{transform:rotate(0)}50%{transform:rotate(-28deg)}}
@keyframes oReach{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-70deg)}}
@keyframes oWiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes oExt{0%,25%,100%{transform:rotate(0)}50%,75%{transform:rotate(-48deg)}}
@keyframes oAnk{0%,100%{transform:rotate(2deg)}50%{transform:rotate(-8deg)}}
@keyframes oCalf{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes oSquat{0%,100%{transform:translateY(0)}50%{transform:translateY(12px)}}
@keyframes oSide{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg)}}
@keyframes oTwist{0%,100%{transform:scaleX(1)}25%,75%{transform:scaleX(.72)}50%{transform:scaleX(1)}}
@keyframes oPelvic{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(5deg)}}
@keyframes oBreathe{0%,100%{transform:scale(1)}45%,60%{transform:scale(1.05) translateY(-2px)}}
@keyframes oEye{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,0)}50%{transform:translate(0,-3px)}75%{transform:translate(3px,0)}}

/* ---------- ui motion ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes marquee{to{transform:translateX(-50%)}}
@keyframes ping{0%{transform:scale(1);opacity:.55}100%{transform:scale(1.7);opacity:0}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes stripes{to{background-position:28px 0}}
@keyframes burst{0%{transform:translateY(0) scale(1);opacity:1}100%{transform:translateY(-170px) scale(.3);opacity:0}}
@keyframes ringOut{0%{transform:scale(.4);opacity:.9}100%{transform:scale(2.2);opacity:0}}
@keyframes breathe{0%,100%{transform:scale(1);opacity:.35}50%{transform:scale(1.08);opacity:.08}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.4)}100%{transform:scale(1)}}
@keyframes blink{50%{opacity:.2}}
@keyframes letter{from{opacity:0;transform:translateY(48px) skewY(8deg)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes popIn{0%{opacity:0;transform:scale(.6)}70%{transform:scale(1.08)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}}
</style>

    for (var i = 0; i < 18; i++) {
      var sz = i % 3 === 0 ? 14 : 10;
      parts += '<span class="p" style="transform:rotate(' + (i * 20 + (i % 2 ? 6 : 0)) + 'deg)"><i style="width:' + sz + 'px;height:' + sz + 'px;border-radius:' + (i % 4 === 0 ? '3px' : '50%') + ';background:' + cols[i % 3] + ';animation-delay:' + (0.02 * (i % 6)) + 's"></i></span>';
    }
    overlay.innerHTML = '<div class="ov done" role="dialog" aria-label="打卡成功">' +
      '<div class="burst" aria-hidden="true"><span class="rg"></span><span class="rg w"></span>' + parts + '</div>' +
      '<span style="font-size:13px;font-weight:700;letter-spacing:2px">打卡成功 · DONE</span>' +
      '<div class="mid"><div class="big">Fully<br>Charged.</div><div style="font-size:20px;font-weight:900;animation:fadeUp .5s ease .5s both">微动一下，满电复工。</div>' +
      '<div class="stats" style="margin-top:18px;animation:fadeUp .5s ease .65s both"><div><b>+' + s.min + '</b><span>活动分钟</span></div><div><b>+40</b><span>XP</span></div><div><b>' + S.micro + '</b><span>今日微动</span></div></div>' +
      '<div class="unlock"><i>' + I.boltB + '</i><span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:12px;color:#FF8A5C;font-weight:700;letter-spacing:1px">徽章解锁</span><b style="font-size:16px;font-weight:900">满电复工</b></span></div></div>' +
      '<div class="two"><button class="press" style="border:2px solid #000;color:#000" data-act="share">晒到小队</button><button class="press" style="background:#000;color:#fff" data-act="finishDone">回到工位</button></div></div>';
    if (navigator.vibrate) { try { navigator.vibrate([40, 60, 120]); } catch (e) {} }
  }
  function closeDone(msg) { S.session = null; S.done = false; overlay.innerHTML = ''; go('home'); toast(msg); }

  // ---------- actions ----------
  var A = {
    lang: function () { ffSetLang(ffLang() === 'en' ? 'zh' : 'en'); },
    tab: function (a) { go(a); },
    checkin: function () { if (S.micro) toast('今天已打卡 · ' + S.micro + ' 次微动 · 连续 ' + S.streak + ' 天'); else start(nextMove()); },
    bell: function () { toast('14:00 会议前，记得来一组颈部唤醒'); },
    start: function (a) { start(BY_ID[a]); },
    quick: function () { var p = listOf(S.scene); if (!p.length) p = listOf('desk'); start(p[Math.floor(Math.random() * p.length)]); },
    stand: function (a, el) {
      S.sitSec = 0; S.standCount++; updateSit(); miniBurst(el);
      if ($('standN')) $('standN').textContent = S.standCount;
      toast('今天第 ' + S.standCount + ' 次站起来，干得漂亮');
    },
    poke: function () {
      S.pokes++;
      var w = $('heroFig'); replay(w, 'boing');
      if (S.pokes === 7) { say('戳出腹肌了！'); toast('解锁隐藏徽章「戳戳乐」'); S.badges.poke = true; return; }
      say(POKE_LINES[(S.pokes - 1) % POKE_LINES.length]);
      if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} }
    },
    shuffle: function () {
      var l = listOf('desk'); if (l.length < 2) return;
      S.nextIdx = (S.nextIdx + 1) % l.length;
      var card = $('nextCard'); replay(card, 'flip'); replay($('shuf'), 'spin');
      setTimeout(function () {
        var m = nextMove(), ni = nextInfo(m);
        $('heroFig').innerHTML = fig(ni.anim, 92, '#4CB5AE', 4);
        $('nextTime').textContent = ni.time; $('nextTitle').textContent = ni.title; $('nextSub').textContent = tagsText(m);
      }, 220);
      setTimeout(function () { say('换我上场！'); }, 460);
    },
    startNext: function () { start(nextMove()); },
    insight: function (a, el) {
      S.insight = !S.insight; $('insight').classList.toggle('on', S.insight);
      el.setAttribute('aria-expanded', S.insight); $('sitMore').textContent = S.insight ? '收起 ▴' : '看详情 ▾';
    },
    tipNext: function () {
      S.tipIdx = (S.tipIdx + 1) % TIPS.length;
      var t = $('tipText'); t.textContent = TIPS[S.tipIdx]; replay(t, 'swap');
      $('tipNo').textContent = pad(S.tipIdx + 1) + '/' + pad(TIPS.length);
      $('tipDots').querySelectorAll('i').forEach(function (d, i) { d.classList.toggle('on', i === S.tipIdx); });
    },
    tipClose: function () {
      S.tipHidden = true; var c = $('tipCard');
      c.style.transition = 'opacity .25s ease, transform .25s ease'; c.style.opacity = '0'; c.style.transform = 'scale(.96)';
      setTimeout(function () { c.remove(); }, 260); toast('好，小贴士先收起来');
    },
    marq: function () { S.fast = !S.fast; $('marq').classList.toggle('fast', S.fast); toast(S.fast ? '加速！动起来' : '回到常速'); },
    mantra: function (a, el) { mantra(a, el); },
    openPromo: openPromo,
    closePromo: closePromo,
    pSize: function (a) {
      P.size = a; $('pWidgets').innerHTML = widgetsHtml();
      document.querySelectorAll('.sizes button').forEach(function (b) { var on = b.dataset.arg === a; b.classList.toggle('on', on); b.setAttribute('aria-selected', on); });
    },
    wGo: function (a) { P.w = +a; paintWatch(); startWatchCycle(); },
    wNext: function () { P.w = (P.w + 1) % 4; paintWatch(); startWatchCycle(); if (navigator.vibrate) { try { navigator.vibrate(10); } catch (e) {} } },
    pNotify: function (a, el) {
      P.notify = !P.notify;
      el.classList.toggle('on', P.notify);
      el.innerHTML = P.notify ? I.check + '已预约，上线第一时间通知你' : I.bell + '预约上线提醒';
      toast(P.notify ? '已预约上线提醒' : '已取消预约');
    },
    pair: pair,
    pairLink: function () { pairStep('link'); pairTimers.push(setTimeout(function () { P.paired = true; pairStep('done'); if (navigator.vibrate) { try { navigator.vibrate([30, 50, 30]); } catch (e) {} } }, 1800)); },
    pairCancel: function () { pairTimers.forEach(clearTimeout); overlay2.innerHTML = ''; },
    pairTry: function () {
      overlay2.innerHTML = '';
      var btn = document.querySelector('.pcta .main'); if (btn) btn.innerHTML = I.watch + '已连接 · 再看一遍配对';
      P.w = 1; paintWatch(); startWatchCycle();
      var ws = document.querySelector('.watchstage'); if (ws) ws.scrollIntoView({ behavior: 'smooth', block: 'center' });
    },
    mClose: closeMantra,
    mSwap: function () {
      stopMTimer(); S.chIdx = (S.chIdx + 1) % CHALLENGES.length;
      var t = $('mText'); t.textContent = CHALLENGES[S.chIdx]; replay(t, 'swap');
      $('mRow').innerHTML = '<span>完成 +5 XP</span><span class="bt"><button class="g press" data-act="mSwap">换一个</button><button class="b press" data-act="mGo">开始</button></span>';
    },
    mGo: mChallenge,
    mFact: function () {
      S.factIdx = (S.factIdx + 1) % FACTS.length; var t = $('mText'); t.textContent = FACTS[S.factIdx]; replay(t, 'swap');
      $('mNo').textContent = (S.factIdx + 1) + '/' + FACTS.length;
    },
    mBreak: mBreak,
    scene: function (a) { S.scene = a; S.query = ''; go('moves'); },
    hi5: function (a) {
      if (S.hi5[a]) return; S.hi5[a] = true;
      var p = PEOPLE.filter(function (x) { return x.id === a; })[0];
      $('hi-' + a).innerHTML = squadBtn(p); toast('已给 ' + p.name + ' 击掌，一起动起来');
    },
    chip: function (a) { S.scene = a; S.query = ''; if ($('search')) $('search').value = ''; refreshMoves(); },
    fav: function (a) {
      var on = !!S.favs[a]; S.favs[a] = !on; save(); var m = BY_ID[a];
      $('fav-' + a).innerHTML = favBtn(m); toast(on ? '已取消收藏' : '已收藏 · ' + m.name);
    },
    playList: function () { var l = listOf(S.scene); if (l.length) startList(listName(S.scene), l); },
    newTag: function (a) { openNewTag(a); },
    fillTag: function (a) { var i = $('tagInput'); if (i) { i.value = a; i.focus(); } },
    createTag: createTag,
    closeTag: function () { pairTimers.forEach(clearTimeout); overlay2.innerHTML = ''; },
    // library
    openLib: function (a) { openLib(a); },
    closeLib: closeLib,
    libPart: function (a) { S.lib.part = a; refreshLib(true); },
    libTarget: function (a) {
      S.lib.target = a; refreshLib(false);
      LIB.forEach(function (m) { var el = $('la-' + m.id); if (el) el.innerHTML = libAddBtn(m); });
    },
    libAdd: function (a) {
      var list = S.lists[S.lib.target] = S.lists[S.lib.target] || [], i = list.indexOf(a), name = listName(S.lib.target);
      if (i >= 0) list.splice(i, 1); else list.push(a);
      save(); $('la-' + a).innerHTML = libAddBtn(BY_ID[a]); refreshLib(false);
      toast(i >= 0 ? '已从「' + name + '」移除' : '已添加到「' + name + '」');
    },
    libStart: function (a) { start(BY_ID[a]); },
    // gear
    bag: function () { toast('购物袋 ' + S.bag + ' 件 · 合计 ' + yuan(bagTotal())); },
    sheet: function (a) { openSheet(a); },
    add: function (a) { toggleAdd(a); },
    eap: function () { toast('已提交咨询，顾问会联系你的 HR'); },
    closeSheet: closeOverlay,
    sheetAdd: function () { var p = S.sheet; closeOverlay(); if (p && !S.added[p.id]) toggleAdd(p.id); },
    sheetTry: function () { var p = S.sheet; if (p) start(BY_NAME[p.moves[0]] || LIB[0]); },
    // session
    exit: function () { S.session = null; overlay.innerHTML = ''; },
    toggle: function () { if (!S.session) return; S.session.paused = !S.session.paused; updateSession(false); },
    next: nextStep,
    prev: function () { var s = S.session; if (!s) return; s.idx = Math.max(0, s.idx - 1); s.ext = 0; s.steps[s.idx].dur = s.steps[s.idx].base; s.remain = s.steps[s.idx].dur; updateSession(true); },
    addTime: function () { var s = S.session; if (!s || s.ext >= 2) return; s.ext++; s.remain += 10; s.steps[s.idx].dur += 10; updateSession(false); replay($('sesTime'), 'bump'); if (navigator.vibrate) { try { navigator.vibrate(15); } catch (e) {} } },
    finishDone: function () { closeDone('已打卡 · 久坐计时已重置'); },
    share: function () { closeDone('已晒到工位小队'); },
    // me
    badge: function (a) { var b = BADGES.filter(function (x) { return x.id === a; })[0]; toast(S.badges[a] ? '已获得 · ' + b.name : '继续微动解锁「' + b.name + '」'); },
    switch: function (a, el) { S[a] = !S[a]; el.setAttribute('aria-checked', S[a] ? 'true' : 'false'); toast(el.dataset.label + (S[a] ? ' 已开启' : ' 已关闭')); },
    ival: function (a) { S.interval = +a; $('ivals').innerHTML = ivalsHtml(); toast('每 ' + a + ' 分钟提醒你动一动'); }
  };
  document.addEventListener('click', function (e) {
    if (S.mantra && e.target.closest('.mtip') && !e.target.closest('button')) {
      // the floating tip never blocks the title: a tap on its body passes through to the line underneath
      var under = document.elementsFromPoint(e.clientX, e.clientY).map(function (n) { return n.closest && n.closest('.hero .ln'); }).filter(Boolean)[0];
      if (under) { mantra(under.dataset.arg, under); return; }
    }
    if (S.mantra && !e.target.closest('.mtip') && !e.target.closest('.hero .ln')) closeMantra();
    var el = e.target.closest('[data-act]'); if (!el) return;
    var fn = A[el.dataset.act]; if (fn) fn(el.dataset.arg, el);
  });
  document.addEventListener('input', function (e) {
    if (e.target.id === 'search') { S.query = e.target.value; $('chips').innerHTML = chipsHtml(); $('moveList').innerHTML = listHtml(); $('listTitle').innerHTML = listTitle(); }
    if (e.target.id === 'libSearch') { S.lib.q = e.target.value; $('libList').innerHTML = libListHtml(); $('libCount').textContent = libHeadCount(); }
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && e.target.id === 'tagInput') { e.preventDefault(); createTag(); return; }
    if (e.key !== 'Escape') return;
    if (overlay2.innerHTML) { overlay2.innerHTML = ''; return; }
    if (overlay.innerHTML) { if (S.done) closeDone('已打卡'); else { S.session = null; closeOverlay(); } return; }
    if (P.open) { closePromo(); return; }
    if (S.lib.open) closeLib();
  });

  // ---------- clock ----------
  setInterval(function () {
    var s = S.session;
    if (s && !S.done) {
      if (s.paused) return;
      s.remain--;
      if (s.remain <= 0) { nextStep(); return; }
      if (s.remain === 3 && navigator.vibrate) { try { navigator.vibrate(25); } catch (e) {} }
      updateSession(false);
    } else if (!s) {
      S.sitSec++;
      if (S.tab === 'home') updateSit();
      updatePromo();
    }
  }, 1000);

  // ---------- PWA: install, offline, shortcuts ----------
  var deferredPrompt = null;
  var isStandalone = function () { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true; };
  var isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  function installSub() {
    if (isStandalone()) return '已安装，从主屏幕打开就是全屏 App';
    if (isIOS) return 'Safari 里点「分享」→「添加到主屏幕」';
    return deferredPrompt ? '离线可用，像原生 App 一样全屏打开' : '用 Chrome / Edge 打开本页即可安装';
  }
  function installBtn() {
    if (isStandalone()) return '<button class="installbtn done" disabled>已安装</button>';
    return '<button class="installbtn press" data-act="install">' + (isIOS ? '怎么装' : '安装') + '</button>';
  }
  function refreshInstall() { if (S.tab === 'me') render(true); }
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; refreshInstall(); });
  window.addEventListener('appinstalled', function () { deferredPrompt = null; toast('已添加到主屏幕'); refreshInstall(); });
  A.install = function () {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function (r) { if (r.outcome !== 'accepted') toast('随时可以在这里再安装'); deferredPrompt = null; refreshInstall(); });
    } else if (isIOS) toast('点底部「分享」→「添加到主屏幕」');
    else toast('在浏览器菜单里选「安装应用」');
  };
  window.addEventListener('offline', function () { toast('已离线，动作和计时照常可用'); });
  window.addEventListener('online', function () { toast('网络已恢复'); });
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('sw.js').then(function (reg) {
        reg.addEventListener('updatefound', function () {
          var nw = reg.installing; if (!nw) return;
          nw.addEventListener('statechange', function () {
            if (nw.state === 'installed' && navigator.serviceWorker.controller) toast('新版本已就绪，下次打开生效');
          });
        });
      }).catch(function () {});
    });
  }
  // home-screen shortcuts (long-press the app icon)
  (function () {
    var q = new URLSearchParams(location.search).get('action');
    if (!q) return;
    history.replaceState(null, '', location.pathname);
    setTimeout(function () {
      if (q === 'quick') A.quick();
      else if (q === 'library') { go('moves'); openLib(S.scene); }
      else if (q === 'devices') openPromo();
    }, 300);
  })();

  render();
})();
</script>
</body>
</html>
